<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTA Kiosk — Tool Tracking</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
  :root { --bg: #111315; --surface: #1c1f23; --surface2: #252830; --border: #363940; --accent: #CB6015; --accent2: #FBDC3E; --text: #D9D9D6; --muted: #B1B3B3; --green: #22c55e; --red: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.15s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-success { background: var(--green); color: white; }
  .btn-danger { background: var(--red); color: white; }
  .btn-icon { padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; cursor: pointer; color: var(--text); font-size: 16px; }
  
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
  .form-input, .form-select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }

  #screen-idle { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 900px; }
  .lta-logo-svg { width: 180px; height: auto; display: block; margin: 0 auto 30px; }
  .lta-logo-svg .st0 { fill: rgba(255,255,255,0.92); }
  .idle-title { font-size: 24px; font-weight: 700; margin-bottom: 40px; color: var(--text); text-align: center; }
  .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
  .action-btn { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; }
  .action-icon { font-size: 48px; margin-bottom: 16px; }
  .action-label { font-size: 18px; font-weight: 700; }

  #screen-auth { display: none; align-items: center; justify-content: center; width: 100%; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; width: 440px; border-top: 3px solid var(--accent); }
  .auth-header { text-align: center; margin-bottom: 24px; }
  
  #screen-action { display: none; width: 100vw; height: 100vh; flex-direction: column; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .accent-bar { height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .auth-banner { display: flex; align-items: center; gap: 12px; background: var(--surface2); padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--accent); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
  .content { flex: 1; padding: 24px; overflow-y: auto; display: flex; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 100%; max-width: 600px; height: fit-content; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  
  .scan-box { background: var(--surface2); border: 2px dashed var(--border); border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 14px; }
  .scan-box.active { border-color: var(--accent); background: rgba(203,96,21,0.05); }
  .batch-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: var(--surface2); border-radius: 6px; margin-bottom: 6px; border-left: 3px solid var(--accent); }
  
  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 9px; padding: 12px 20px; z-index: 200; display: none; box-shadow: 0 8px 28px rgba(0,0,0,0.5); }
  /* Persistent Home Button */
  .persistent-home { 
    position: fixed; 
    Bottom: 20px; 
    left: 20px; 
    background: var(--surface); 
    border: 1px solid var(--border); 
    color: var(--muted); 
    padding: 8px 14px; 
    border-radius: 8px; 
    text-decoration: none; 
    font-size: 13px; 
    font-weight: 600; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    transition: 0.2s; 
    z-index: 9999; 
  }
  .persistent-home:hover { 
    color: var(--text); 
    border-color: var(--accent); 
    background: var(--surface2); 
  }
</style>
</head>
<body>
  
  <a href="index.html" class="persistent-home">🏠 Main Hub</a>

  <div id="screen-idle">
    <svg class="lta-logo-svg" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431.4 212.9">
      <path class="st0" d="M75.1,107c-0.1-64.8,76.8-92,84.8-94.6l0,0C83.9,28.9,38.9,73.5,21,95c-5.7,6.9-5.7,16.9,0,23.8c17.8,21.4,62.6,65.7,138,82.5C148.8,197.8,75.2,170.2,75.1,107z"/>
      <path class="st0" d="M164,134l0-96l-7.3,0c-13.8,0-25,11.2-25,25l0,70.8c0,24.9,20.1,45,45,45l45.5,0l0-7.3c0-13.8-11.2-25-25-25l-20.7,0C169.6,146.5,164,140.9,164,134z"/>
      <path class="st0" d="M242.9,38c12.7,6.5,22.3,18.1,26,32.2H295l1.1-3.9c0.3-1.1,2.6-9.5,9.3-18c2.7-3.4,6.4-7.1,11.1-10.3H242.9z"/>
      <path class="st0" d="M332.6,75.8c0.6-2,2-11,11.1-11c9.2,0,10.8,9,11.3,11s9.3,33.4,9.3,33.4h-35.5l-3,10.6c-3,10.8,5.1,21.6,16.4,21.6h21.6c5.6,0,10.5,3.7,12,9.1l2.8,10c3,10.8,12.9,18.3,24.1,18.3h14.5l-31-111c0,0-8.1-32.1-42.5-32.1s-42.4,32-42.4,32l-31.1,111.1h14.5c11.2,0,21.1-7.5,24.1-18.3L332.6,75.8z"/>
      <path class="st0" d="M232.7,82.8l0,96l7.3,0c13.8,0,25-11.2,25-25l0-70.8c0-24.9-20.1-45-45-45l-45.5,0l0,7.3c0,13.8,11.2,25,25,25l20.7,0C227.1,70.3,232.7,75.9,232.7,82.8z"/>
    </svg>
    <div class="idle-title">Select Kiosk Action</div>
    <div class="action-grid">
      <div class="action-btn" onclick="startWorkflow('OUT')"><div class="action-icon">📤</div><div class="action-label">Check Out Tools</div></div>
      <div class="action-btn" onclick="startWorkflow('IN')"><div class="action-icon">📥</div><div class="action-label">Check In Tools</div></div>
      <div class="action-btn" onclick="startWorkflow('REPORT')" style="border-color: rgba(239,68,68,0.5);"><div class="action-icon">⚠️</div><div class="action-label">Report Issue</div></div>
    </div>
    <a href="index.html" style="margin-top: 40px; color: var(--muted); text-decoration: none; font-size: 13px;">← Back to Hub</a>
  </div>

  <div id="screen-auth">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 32px; margin-bottom: 10px;" id="auth-header-icon">🪪</div>
        <div class="auth-title" id="auth-header-title">Identify Technician</div>
        <div class="auth-sub">Scan Badge or Enter Username</div>
      </div>
    
      <div id="auth-reader" style="width: 100%; display: none; margin-bottom: 14px; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent);"></div>

      <div class="form-group" style="display: flex; gap: 8px; align-items: center;">
        <input class="form-input" id="auth-badge-input" style="font-size: 18px; padding: 12px; text-align: center;" placeholder="Badge or Username..." onkeydown="if(event.key==='Enter')authenticateUser()">
        <button class="btn-icon" onclick="startAuthCameraScanner()" title="Camera">📷</button>
      </div>
    
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="resetToIdle()">Cancel</button>
        <button class="btn btn-primary" style="flex: 2;" onclick="authenticateUser()">Next →</button>
      </div>
    </div>
  </div>

  <div id="screen-action">
    <div class="topbar">
      <div class="auth-banner"><div class="avatar" id="user-avatar">--</div><div><div style="font-weight: 700; font-size: 14px;" id="user-name">Loading...</div><div style="font-size: 11px; color: var(--muted);" id="user-meta">Authorized</div></div></div>
      <button class="btn btn-secondary" onclick="resetToIdle()">Cancel & Log Out</button>
    </div>
    <div class="accent-bar"></div>

  <div class="content">
    <div class="card" id="panel-scanner">
      <div class="section-title" id="action-title">📤 Scanning Tools...</div>
      
      <div class="scan-box" id="scan-zone" onclick="focusScanInput()">
        <div style="font-size: 40px; margin-bottom: 10px;">📷</div>
        <div style="font-weight: 600;" id="scan-prompt">Ready to Scan Tool</div>
      </div>

      <div id="reader" style="width: 100%; max-width: 600px; display: none; margin-bottom: 14px; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent);"></div>
      <button class="btn btn-secondary" style="width: 100%; margin-bottom: 14px;" onclick="startToolCameraScanner()">📱 Open Camera Scanner</button>

      <div class="form-group">
        <input class="form-input" id="kiosk-scan-input" placeholder="Scan hardware or type serial..." onkeydown="if(event.key==='Enter')handleToolScan()">
      </div>

      <div style="font-weight: 700; font-size: 12px; color: var(--muted); margin-bottom: 8px;">BATCH QUEUE (<span id="queue-count">0</span> tools)</div>
      <div id="queue-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 14px;"></div>
      
      <button class="btn btn-success" style="width: 100%; padding: 14px; font-size: 16px;" onclick="submitTransaction()" id="btn-submit-action">✓ Finalize Transaction</button>
    </div>

    <div class="card" id="panel-report" style="display: none;">
      <div class="section-title">⚠️ Report Damaged or Missing Asset</div>
      <div id="report-reader" style="width: 100%; display: none; margin-bottom: 14px; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent);"></div>
      <div class="form-group">
        <label class="form-label">Tool Barcode / Serial</label>
        <div style="display: flex; gap: 8px;">
          <input class="form-input" id="report-qr" placeholder="Scan or enter faulty tool">
          <button class="btn-icon" onclick="startReportCameraScanner()">📷</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Issue Type</label>
        <select class="form-select" id="report-type"><option value="Broken">Broken / Damaged</option><option value="Missing">Missing / Lost</option><option value="Worn">Worn / Needs Cal</option></select>
      </div>
      <div class="form-group"><label class="form-label">Condition Notes</label><textarea class="form-input" id="report-notes" rows="4" placeholder="Detail the damage..."></textarea></div>
      <button class="btn btn-danger" style="width: 100%; padding: 14px; font-size: 16px;" onclick="submitProblemReport()">Submit Registry Log</button>
    </div>
  </div>
</div>

<div class="toast" id="kiosk-toast">Toast Message</div>

<script>
  let activeUser = null; let pendingMode = null; let batchQueue = []; let html5QrScannerInstance = null;

  function startWorkflow(mode) {
    pendingMode = mode;
    const authIcon = document.getElementById('auth-header-icon'); const authTitle = document.getElementById('auth-header-title');
    if (mode === 'OUT') { authIcon.textContent = '📤'; authTitle.textContent = 'Check Out'; }
    if (mode === 'IN') { authIcon.textContent = '📥'; authTitle.textContent = 'Check In'; }
    if (mode === 'REPORT') { authIcon.textContent = '⚠️'; authTitle.textContent = 'Issue Report'; }
    document.getElementById('screen-idle').style.display = 'none'; document.getElementById('screen-auth').style.display = 'flex'; document.getElementById('auth-badge-input').focus();
  }

  async function authenticateUser() {
    const loginId = document.getElementById('auth-badge-input').value.trim();
    if (!loginId) return showToast('⚠️ Identifier is required.');
    try {
      const response = await fetch('/api/kiosk-auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login_id: loginId }) });
      const data = await response.json();
      if (!response.ok) return showToast('❌ ' + (data.error || 'Identity not recognized.'));

      // Use the actual badge_id from the database for transactions, no matter what they typed to log in
      activeUser = { badgeId: data.user.badge_id, name: data.user.full_name, initials: data.user.full_name.split(' ').map(n => n[0]).join('') };
      document.getElementById('user-avatar').textContent = activeUser.initials; 
      document.getElementById('user-name').textContent = activeUser.name;
      document.getElementById('auth-badge-input').value = '';
      document.getElementById('screen-auth').style.display = 'none'; 
      document.getElementById('screen-action').style.display = 'flex';
      setupActionScreen();
    } catch (err) { showToast('❌ Server error.'); }
  }

  function setupActionScreen() {
    batchQueue = []; renderQueue();
    if (pendingMode === 'REPORT') { document.getElementById('panel-scanner').style.display = 'none'; document.getElementById('panel-report').style.display = 'block'; document.getElementById('report-qr').focus(); } 
    else {
      document.getElementById('panel-scanner').style.display = 'block'; document.getElementById('panel-report').style.display = 'none';
      document.getElementById('action-title').textContent = pendingMode === 'OUT' ? '📤 Scan Tools for Checkout' : '📥 Scan Tools for Check-in';
      document.getElementById('btn-submit-action').textContent = pendingMode === 'OUT' ? '✓ Complete Checkout' : '✓ Complete Check-in';
      focusScanInput();
    }
  }

  function killActiveCamera() {
    if (html5QrScannerInstance && html5QrScannerInstance.isScanning) {
        html5QrScannerInstance.stop().then(() => { document.getElementById('reader').style.display = 'none'; document.getElementById('auth-reader').style.display = 'none'; document.getElementById('report-reader').style.display = 'none'; }).catch(e => {});
    }
  }

  function resetToIdle() { killActiveCamera(); activeUser = null; pendingMode = null; batchQueue = []; document.getElementById('auth-badge-input').value = ''; document.getElementById('screen-action').style.display = 'none'; document.getElementById('screen-auth').style.display = 'none'; document.getElementById('screen-idle').style.display = 'flex'; }

  function focusScanInput() {
    const input = document.getElementById('kiosk-scan-input');
    if(input && document.getElementById('screen-action').style.display === 'flex' && pendingMode !== 'REPORT') { input.focus(); document.getElementById('scan-zone').classList.add('active'); }
  }

  function handleToolScan() {
    const input = document.getElementById('kiosk-scan-input');
    const qr = input.value.trim().toUpperCase();
    if (!qr) return;
    if (batchQueue.includes(qr)) { showToast('⚠️ Already in queue.'); input.value = ''; return; }
    batchQueue.push(qr); renderQueue(); input.value = ''; showToast(`➕ Added: ${qr}`);
  }

  function renderQueue() {
    document.getElementById('queue-count').textContent = batchQueue.length;
    document.getElementById('queue-list').innerHTML = batchQueue.map((qr, index) => `<div class="batch-item"><div>🔧 <strong>${qr}</strong></div><div style="color:var(--red);cursor:pointer;font-weight:bold;font-size:16px;padding:0 10px;" onclick="removeItem(${index})">✕</div></div>`).join('');
  }
  function removeItem(index) { batchQueue.splice(index, 1); renderQueue(); }

  function executeCameraScan(elementId, successCallback) {
      document.getElementById(elementId).style.display = 'block';
      if(html5QrScannerInstance) { html5QrScannerInstance.clear(); }
      html5QrScannerInstance = new Html5Qrcode(elementId);
      
      Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length) {
              html5QrScannerInstance.start(devices[0].id, { fps: 14, qrbox: { width: 260, height: 260 } }, (text) => {
                  html5QrScannerInstance.stop().then(() => { document.getElementById(elementId).style.display = 'none'; successCallback(text); });
              }).catch(err => { showToast('❌ Camera Error: ' + err); document.getElementById(elementId).style.display = 'none'; });
          } else { showToast("⚠️ No cameras found."); document.getElementById(elementId).style.display = 'none'; }
      }).catch(err => { showToast("❌ Camera permission denied."); document.getElementById(elementId).style.display = 'none'; });
  }

  function startAuthCameraScanner() { executeCameraScan('auth-reader', (txt) => { document.getElementById('auth-badge-input').value = txt; authenticateUser(); }); }
  function startToolCameraScanner() { executeCameraScan('reader', (txt) => { document.getElementById('kiosk-scan-input').value = txt; handleToolScan(); }); }
  function startReportCameraScanner() { executeCameraScan('report-reader', (txt) => { document.getElementById('report-qr').value = txt; }); }

  async function submitTransaction() {
    if (batchQueue.length === 0) return showToast('⚠️ Queue empty.');
    try {
      const response = await fetch('/api/transactions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ badge_id: activeUser.badgeId, action: pendingMode === 'OUT' ? 'CHECKOUT_TOOL' : 'CHECKIN_TOOL', qr_codes: batchQueue }) });
      if (!response.ok) return showToast('❌ Failed.');
      showToast(`✅ Logged ${batchQueue.length} assets.`); setTimeout(resetToIdle, 1500);
    } catch (err) { showToast('❌ Connection error.'); }
  }

  async function submitProblemReport() {
    const qr = document.getElementById('report-qr').value.trim().toUpperCase(); const type = document.getElementById('report-type').value; const notes = document.getElementById('report-notes').value.trim();
    if (!qr || !notes) return showToast('⚠️ Tag and description mandatory.');
    try {
      const response = await fetch('/api/tools/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ badge_id: activeUser.badgeId, qr_code: qr, issue_type: type, notes: notes }) });
      if (!response.ok) return showToast('❌ Error.');
      showToast(`🚨 Status altered to ${type}.`); setTimeout(resetToIdle, 1500);
    } catch (err) { showToast('❌ Error.'); }
  }

  function showToast(msg) { const el = document.getElementById('kiosk-toast'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => { el.style.display = 'none'; }, 3500); }
  document.getElementById('kiosk-scan-input').addEventListener('blur', () => { setTimeout(focusScanInput, 200); });
</script>
</body>
</html>
