<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTA Tool Tracking Hub</title>

    <link rel="stylesheet" href="style.css">

    <!-- PWA: installable app support. Each page links its own manifest so installing
         from a given screen (kiosk, admin, dashboard) creates a home-screen icon that
         opens straight to that screen, rather than everyone sharing one generic icon
         that always lands on the hub. -->
    <link rel="manifest" href="manifest-index.json">
    <meta name="theme-color" content="#111315">
    <link rel="icon" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ToolTracker">
</head>
<body class="index-layout">

    <!-- Inline SVG logo block: LTA Research logo rendered as vector paths (styled via .lta-logo-svg / .st0 in style.css) -->
    <svg class="lta-logo-svg" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431.4 212.9">
        <path class="st0" d="M75.1,107c-0.1-64.8,76.8-92,84.8-94.6l0,0C83.9,28.9,38.9,73.5,21,95c-5.7,6.9-5.7,16.9,0,23.8c17.8,21.4,62.6,65.7,138,82.5C148.8,197.8,75.2,170.2,75.1,107z"/>
        <path class="st0" d="M164,134l0-96l-7.3,0c-13.8,0-25,11.2-25,25l0,70.8c0,24.9,20.1,45,45,45l45.5,0l0-7.3c0-13.8-11.2-25-25-25l-20.7,0C169.6,146.5,164,140.9,164,134z"/>
        <path class="st0" d="M242.9,38c12.7,6.5,22.3,18.1,26,32.2H295l1.1-3.9c0.3-1.1,2.6-9.5,9.3-18c2.7-3.4,6.4-7.1,11.1-10.3H242.9z"/>
        <path class="st0" d="M332.6,75.8c0.6-2,2-11,11.1-11c9.2,0,10.8,9,11.3,11s9.3,33.4,9.3,33.4h-35.5l-3,10.6c-3,10.8,5.1,21.6,16.4,21.6h21.6c5.6,0,10.5,3.7,12,9.1l2.8,10c3,10.8,12.9,18.3,24.1,18.3h14.5l-31-111c0,0-8.1-32.1-42.5-32.1s-42.4,32-42.4,32l-31.1,111.1h14.5c11.2,0,21.1-7.5,24.1-18.3L332.6,75.8z"/>
        <path class="st0" d="M232.7,82.8l0,96l7.3,0c13.8,0,25-11.2,25-25l0-70.8c0-24.9-20.1-45-45-45l-45.5,0l0,7.3c0,13.8,11.2,25,25,25l20.7,0C227.1,70.3,232.7,75.9,232.7,82.8z"/>
    </svg>

    <!-- Main menu grid: 3 navigation cards linking to the app's primary sections -->
    <div class="menu-grid">
        <!-- Routes to kiosk.html: shop-floor kiosk for checking tools in/out and reporting damaged assets -->
        <a href="kiosk.html" class="menu-card">
            <div class="menu-icon">📱</div>
            <div class="menu-title">Shop Floor Kiosk</div>
            <div class="menu-desc">Check tools in/out and report damaged assets.</div>
        </a>
        <!-- Routes to admin.html: admin portal for managing personnel, infrastructure, and inventory -->
        <a href="admin.html" class="menu-card">
            <div class="menu-icon">⚙️</div>
            <div class="menu-title">Admin Portal</div>
            <div class="menu-desc">Manage personnel, infrastructure, and inventory.</div>
        </a>
        <!-- Routes to dashboard.html: global dashboard for real-time telemetry and data analytics -->
        <a href="dashboard.html" class="menu-card">
            <div class="menu-icon">📈</div>
            <div class="menu-title">Global Dashboard</div>
            <div class="menu-desc">View real-time telemetry and data analytics.</div>
        </a>
    </div>

    <script src="sw-register.js"></script>
</body>
</html>
