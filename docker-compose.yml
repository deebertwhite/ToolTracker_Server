# ==========================================
# ToolTracker Docker Compose
# ==========================================
# This file only stands up supporting infrastructure: the PostgreSQL
# database. The Node/Express application itself (server.js) is NOT
# containerized here -- it is run directly on the host machine (and, in
# production, on the Raspberry Pi) via "node server.js", and it connects
# to the "db" service below over the network (see the DATABASE
# CONFIGURATION section in server.js).
#
# A Metabase reporting service used to live here too, but it was removed:
# it shared this same Postgres database for its own internal metadata
# (dashboards, users, job scheduler, etc.), which filled the database with
# 150+ unrelated tables, and it wasn't being used for anything. If a
# reporting dashboard is wanted again later, give it its own dedicated
# database rather than pointing it at "tooltracker" directly.
services:
  # 1. The Database
  # PostgreSQL instance that stores all ToolTracker application data
  # (tools, checkouts, users, etc.). server.js connects to this database
  # directly using the pg Pool client; it is not started or managed by
  # server.js in any way.
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: tooladmin
      # Read from the .env file in this same directory (docker-compose loads it
      # automatically) -- the exact same DB_PASSWORD value server.js reads via
      # process.env, so both sides always agree and nothing is hardcoded in source control.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env -- copy .env.example to .env and fill it in}
      POSTGRES_DB: tooltracker
    ports:
      - "5432:5432"
    volumes:
      # Bind-mounted under BASE_STORAGE_PATH (same variable server.js reads -- see
      # .env.example) rather than a Docker-managed named volume, so the database lives on
      # the same durable storage as photos/logs instead of defaulting to the SD card. A
      # Docker-managed volume for Postgres data specifically is a real risk on a Pi: SD
      # cards wear out and fail far more often than a proper external drive, and losing the
      # SD card would previously have meant losing every tool/user/audit record, even though
      # photos and logs already lived safely on the external drive. Defaults to a local
      # ./postgres_data folder for local PC dev, where there's no external drive concept and
      # BASE_STORAGE_PATH is normally left unset.
      - ${BASE_STORAGE_PATH:-.}/postgres_data:/var/lib/postgresql/data

# No top-level `volumes:` section anymore -- see the bind-mount comment above.