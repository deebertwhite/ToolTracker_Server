version: '3.8'
services:
  # 1. The Database
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: tooladmin
      POSTGRES_PASSWORD: SuperSecretPassword123
      POSTGRES_DB: tooltracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. The Boss's Dashboard
  metabase:
    image: metabase/metabase:latest
    restart: always
    ports:
      - "3001:3000" # Metabase will run on localhost:3001
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: tooltracker
      MB_DB_PORT: 5432
      MB_DB_USER: tooladmin
      MB_DB_PASS: SuperSecretPassword123
      MB_DB_HOST: db
    depends_on:
      - db

volumes:
  pgdata: